name = "brokkommission-push"
main = "worker.mjs"
compatibility_date = "2026-11-17"
workers_dev = true

[vars]
APP_ORIGIN = "https://henrikeskelund-spec.github.io"
APP_URL = "https://henrikeskelund-spec.github.io/maartens-brokvagt/"
# VAPID_SERVER_PUBLIC_KEY, VAPID_SERVER_PRIVATE_KEY and VAPID_SUBJECT
# must be configured as secrets, not committed.

[triggers]
crons = ["0 7,8,11,12,16,17 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "brokkommission-push"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
